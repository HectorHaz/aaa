services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      JWT_ACCESS_SECRET: dev_access_secret
      JWT_REFRESH_SECRET: dev_refresh_secret
    ports: ["4000:4000"]
    depends_on: [db, redis]
    command: sh -c "npm run db:migrate -w apps/api && npm run db:seed -w apps/api && npm run dev -w apps/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports: ["5173:5173"]
    depends_on: [api]
    command: npm run dev -w apps/web -- --host 0.0.0.0

volumes:
  pg_data:
